name: 构建并部署

on:
  push:
    branches: [main, dev2]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      # ── 构建前端 H5 ─────────────────────────────────────────
      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: 安装前端依赖
        working-directory: frontend
        run: npm ci --legacy-peer-deps

      - name: 构建前端 H5
        working-directory: frontend
        run: npm run build:h5
        env:
          VUE_APP_API_BASE_URL: ""   # 同域部署，留空走 Nginx 代理

      # ── 构建并推送后端 Docker 镜像 ──────────────────────────
      - name: 配置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: 构建并推送后端镜像
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/dyslexia-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── 上传前端产物到服务器 ────────────────────────────────
      - name: 上传前端静态文件
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "frontend/dist/build/h5/"
          target: "/opt/dyslexia-app/"
          strip_components: 0

      # ── SSH 到服务器执行部署 ─────────────────────────────────
      - name: 部署到服务器
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e
            cd /opt/dyslexia-app

            # 拉取最新后端镜像并重启
            docker compose -f docker-compose.prod.yml pull backend
            docker compose -f docker-compose.prod.yml up -d --no-build

            # 等待后端就绪后执行数据库迁移
            sleep 15
            docker exec dyslexia-backend alembic upgrade head || true

            docker image prune -f
            echo "✅ 部署完成 $(date)"
