version: '3.8'

services:
  backend:
    build: ./backend
    container_name: dyslexia-backend
    restart: always
    ports:
      - "8000:8000"
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/dyslexia.db:/app/dyslexia.db
    env_file:
      - ./backend/.env

  nginx:
    image: nginx:alpine
    container_name: dyslexia-nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./frontend/dist/build/h5:/usr/share/nginx/html
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend
