version: "3.9"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dyslexia-backend
    restart: unless-stopped
    environment:
      - DEBUG=False
      - DATABASE_URL=sqlite:////app/data/dyslexia.db
      - SECRET_KEY=4f7a217b0b92ca54a2ac384a948a571576d75df3ebcd13d2ef7b82321952feeb
      - ALLOWED_ORIGINS=http://118.145.185.15
      - UPLOAD_DIR=/app/uploads
    volumes:
      - uploads_data:/app/uploads
      - sqlite_data:/app/data
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: dyslexia-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  uploads_data:
  sqlite_data:
