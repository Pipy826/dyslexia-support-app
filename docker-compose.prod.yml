version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: dyslexia-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: dyslexia
      POSTGRES_USER: dyslexia_user
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dyslexia_user -d dyslexia"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: dyslexia-backend:latest
    container_name: dyslexia-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M        # 超出时自动重启容器，不拖垮服务器
        reservations:
          memory: 128M
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  nginx:
    image: nginx:alpine
    container_name: dyslexia-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend/dist/build/h5:/usr/share/nginx/html:ro
      - uploads_data:/usr/share/nginx/uploads:ro
    deploy:
      resources:
        limits:
          memory: 64M
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  uploads_data:
