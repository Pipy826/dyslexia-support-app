version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: dyslexia-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: dyslexia
      POSTGRES_USER: dyslexia_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change_me_in_production}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dyslexia_user -d dyslexia"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dyslexia-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    volumes:
      - uploads_data:/app/uploads
    environment:
      - DATABASE_URL=postgresql://dyslexia_user:${DB_PASSWORD:-change_me_in_production}@postgres:5432/dyslexia
      - DEBUG=False
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  nginx:
    image: nginx:alpine
    container_name: dyslexia-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./frontend/dist/build/h5:/usr/share/nginx/html:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - uploads_data:/usr/share/nginx/uploads:ro
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  uploads_data:
